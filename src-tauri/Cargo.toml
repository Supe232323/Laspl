[package]
name = "laspl"
version = "1.0.5"
description = "Laspl - Simple, intuitive, secure password manager"
authors = ["supe232323"]
edition = "2024" 

[lib]
name = "laspl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.6" # Synced with Renovate for top-tier password hashing
aes-gcm = "0.11" # Synced with Renovate for modern stream encryption
rand = "0.10" # Synced to modern v0.10 namespaces
rand_core = "0.6" # Injected to protect your vault.rs imports
zeroize = { version = "1", features = ["derive"] }
thiserror = "2" # Cleaned up modern error handling profiles
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
dirs = "7"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
